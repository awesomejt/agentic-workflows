schema_version: 1
id: workstation
description: Local workstation agent CLI and editor configuration.
kind: local
environment: home-lab
deployment:
  mode: copy
  backup_root: ${XDG_STATE_HOME}/agentic-workflows/backups
  state_root: ${XDG_STATE_HOME}/agentic-workflows
adapters:
  - id: opencode
    enabled: true
    destination: ${XDG_CONFIG_HOME}/opencode
  - id: codex
    enabled: true
    destination: ${CODEX_HOME}
  - id: claude
    enabled: true
    destination: ${CLAUDE_HOME}
  - id: grok
    enabled: true
    destination: ${GROK_HOME}
  - id: copilot
    enabled: true
    destination: ${HOME}
    notes: Authentication and extension runtime state are unmanaged.
