schema_version: 1
id: hermes
description: Versioned Hermes behavior and client-contract bundle consumed by Ansible.
status: active
artifacts:
  - source: common/instructions
    destination: common/instructions
  - source: common/prompts
    destination: common/prompts
  - source: common/roles
    destination: common/roles
  - source: common/skills
    destination: common/skills
  - source: common/workflows
    destination: common/workflows
  - source: hermes/profiles.yaml
    destination: hermes/profiles.yaml
  - source: hermes/ansible-contract.yaml
    destination: hermes/ansible-contract.yaml
  - source: services
    destination: services
