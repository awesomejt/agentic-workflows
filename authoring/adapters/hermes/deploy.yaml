schema_version: 1
id: hermes
description: Versioned Hermes behavior and client-contract bundle consumed by Ansible.
status: active
artifacts:
  - source: authoring/common/instructions
    destination: common/instructions
  - source: authoring/common/prompts
    destination: common/prompts
  - source: authoring/common/roles
    destination: common/roles
  - source: authoring/common/skills
    destination: common/skills
  - source: authoring/common/workflows
    destination: common/workflows
  - source: authoring/adapters/hermes/profiles.yaml
    destination: hermes/profiles.yaml
  - source: authoring/adapters/hermes/ansible-contract.yaml
    destination: hermes/ansible-contract.yaml
  - source: source/services
    destination: services
