[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "agentic-workflowctl"
version = "0.1.0"
description = "Validate, render, deploy, and audit agentic workflow configuration"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "jsonschema>=4.20,<5",
  "PyYAML>=6,<7",
]

[project.scripts]
workflowctl = "workflowctl.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/workflowctl"]
