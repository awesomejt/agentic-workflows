schema_version: 1
id: copilot
description: GitHub Copilot and VS Code instructions, custom agents, Agent Skills, and MCP.
status: active
artifacts:
  - source: common/instructions/core.md
    destination: .copilot/instructions/agentic-workflows.instructions.md
    header: copilot/frontmatter/instructions.md
  - source: common/skills
    destination: .copilot/skills
  - source: common/roles/planner.md
    destination: .copilot/agents/planner.agent.md
    header: copilot/frontmatter/planner.md
  - source: common/roles/debater.md
    destination: .copilot/agents/debater.agent.md
    header: copilot/frontmatter/debater.md
  - source: common/roles/implementer.md
    destination: .copilot/agents/implementer.agent.md
    header: copilot/frontmatter/implementer.md
  - source: common/roles/validator.md
    destination: .copilot/agents/validator.agent.md
    header: copilot/frontmatter/validator.md
  - source: common/roles/tester.md
    destination: .copilot/agents/tester.agent.md
    header: copilot/frontmatter/tester.md
  - source: common/roles/reviewer.md
    destination: .copilot/agents/reviewer.agent.md
    header: copilot/frontmatter/reviewer.md
  - source: common/roles/writer.md
    destination: .copilot/agents/writer.agent.md
    header: copilot/frontmatter/writer.md
  - source: common/roles/git-committer.md
    destination: .copilot/agents/git-committer.agent.md
    header: copilot/frontmatter/git-committer.md
  - source: common/roles/project-manager.md
    destination: .copilot/agents/project-manager.agent.md
    header: copilot/frontmatter/project-manager.md
  - source: copilot/mcp.json
    destination: .config/Code/User/mcp.json
